name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash tests/run.sh
      - run: bash tests/docs-sync.sh
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pint
      - run: pint --test
  # Installs the plugin in a real Pelican panel and opens its pages, so an error that only shows when the panel loads the code blocks the merge.
  panel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pelican: '1.0.0-beta38'
            php: '8.3'
          - pelican: '1.0.0-rc.2'
            php: '8.4'
          # With Simplify the links show in its overview and server cards: the customer view needs the live Simplify.
          - pelican: '1.0.0-rc.2'
            php: '8.4'
            simplify: 'v1.5.5'
          # Simplify 1.5.6 and newer: admins of a large panel start on the Admin page (add-on API 5).
          - pelican: '1.0.0-rc.2'
            php: '8.4'
            simplify: 'main'
    name: panel-smoke (Pelican ${{ matrix.pelican }}${{ matrix.simplify && format(', Simplify {0}', matrix.simplify) || '' }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican ${{ matrix.pelican }}
        run: |
          git clone --quiet --depth 1 --branch "v${{ matrix.pelican }}" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '${{ matrix.pelican }}'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      - name: Install Simplify ${{ matrix.simplify }}
        if: matrix.simplify
        run: |
          git clone --quiet --depth 1 --branch "${{ matrix.simplify }}" https://github.com/jerajerajerajera/simplify.git panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          php artisan p:plugin:list | grep -E '\| Simplify .*\| enabled' || { echo 'Simplify did not install'; exit 1; }
      # The way panels update: the first Hub version (2.0.0-beta.1) with every setting filled in, then this version over it.
      - name: Install Simplify Hosting 2.0.0-beta.1 with its settings filled in
        run: |
          git clone --quiet --depth 1 --branch v2.0.0-beta.1 "https://github.com/${{ github.repository }}.git" panel/plugins/simplify-hosting
          rm -rf panel/plugins/simplify-hosting/.git
          cd panel
          php artisan p:plugin:install simplify-hosting
          php artisan p:plugin:list | grep -E 'Simplify Hosting .*\| enabled' || { echo 'Simplify Hosting 2.0.0-beta.1 did not install'; exit 1; }
          php ../plugin/tests/panel/settings.php fill
      - name: Update to this version of Simplify Hosting
        run: |
          rm -rf panel/plugins/simplify-hosting
          mkdir -p panel/plugins/simplify-hosting
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-hosting -xf -
          cd panel
          # As the Hub's update does it (PluginService::updatePlugin): new files, then the install steps without enabling again.
          php artisan tinker --execute="App\Models\Plugin::refreshRows(); app(App\Services\Helpers\PluginService::class)->installPlugin(App\Models\Plugin::findOrFail('simplify-hosting'), false);"
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify Hosting .*\| enabled' plugins.txt || { echo 'Simplify Hosting did not update'; exit 1; }
          php ../plugin/tests/panel/settings.php check
      - name: Open the pages
        working-directory: panel
        run: |
          php plugins/simplify-hosting/tests/panel/smoke.php | tee smoke.txt
          grep -q '^All steps passed$' smoke.txt
      - name: Uninstall and install again
        working-directory: panel
        # Uninstalling keeps the hoster's settings; Pelican's own pages still open without the plugin.
        run: |
          php plugins/simplify-hosting/tests/panel/settings.php fill
          php artisan p:plugin:uninstall simplify-hosting
          php artisan p:plugin:list | grep -E 'Simplify Hosting .*\| not installed' || { echo 'Simplify Hosting did not uninstall'; exit 1; }
          php plugins/simplify-hosting/tests/panel/settings.php check
          php artisan tinker --execute="\$r = app(Illuminate\Contracts\Http\Kernel::class)->handle(Illuminate\Http\Request::create('/login')); echo 'login '.\$r->getStatusCode();" | tee login.txt
          grep -qx 'login 200' login.txt || { echo 'Pelican does not open without Simplify Hosting'; exit 1; }
          php artisan p:plugin:install simplify-hosting
          php artisan p:plugin:list | grep -E 'Simplify Hosting .*\| enabled' || { echo 'Simplify Hosting did not install again'; exit 1; }
          php plugins/simplify-hosting/tests/panel/settings.php check
      # A panel that goes back (the Beelink script puts the old folder back) keeps the newer tables: the previous release must still open its pages on them.
      - name: Back to the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')"
          echo "previous release: $tag"
          cp plugin/tests/panel/settings.php settings.php
          rm -rf panel/plugins/simplify-hosting
          git clone --quiet --depth 1 --branch "$tag" "https://github.com/${{ github.repository }}.git" panel/plugins/simplify-hosting
          rm -rf panel/plugins/simplify-hosting/.git
          cd panel
          php artisan tinker --execute="App\Models\Plugin::refreshRows(); app(App\Services\Helpers\PluginService::class)->installPlugin(App\Models\Plugin::findOrFail('simplify-hosting'), false);"
          php ../settings.php check
          php plugins/simplify-hosting/tests/panel/smoke.php | tee back.txt
          grep -q '^All steps passed$' back.txt || { echo "$tag does not open its pages after this version"; exit 1; }
          # This version's files again, for PHPStan below.
          cd .. && rm -rf panel/plugins/simplify-hosting && mkdir -p panel/plugins/simplify-hosting
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-hosting -xf -
      - name: PHPStan (level 5, in the panel)
        if: matrix.simplify == 'main' # the add-on's classes extend the core's
        working-directory: panel
        # After the smoke: installing larastan brings PHPUnit into the panel, which changes how Livewire's test helpers behave.
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --quiet
          # No baseline: every finding fails the run, so the code stays at zero.
          vendor/bin/phpstan analyse --configuration plugins/simplify-hosting/phpstan.neon --memory-limit 1G --no-progress --error-format=github
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
